<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title description">
  <title id="title">AYNI Twin current public architecture</title>
  <desc id="description">User browser connects to AWS Amplify Hosting, which serves the AYNI Twin static application. All profiles and calculations are local and synthetic.</desc>
  <defs>
    <filter id="shadow" x="-15%" y="-25%" width="130%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#245b78" flood-opacity=".1"/>
    </filter>
    <linearGradient id="thread" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c95f4a"/>
      <stop offset=".5" stop-color="#d58b32"/>
      <stop offset="1" stop-color="#177e78"/>
    </linearGradient>
    <style>
      .title{font:700 31px Manrope,Segoe UI,sans-serif;fill:#17324d}
      .label{font:700 22px Manrope,Segoe UI,sans-serif;fill:#17324d}
      .detail{font:500 16px Manrope,Segoe UI,sans-serif;fill:#52697c}
      .kicker{font:800 13px Manrope,Segoe UI,sans-serif;letter-spacing:2px;fill:#177e78}
      .card{fill:#fff;stroke:#d8e2de;stroke-width:2}
    </style>
  </defs>
  <rect width="1200" height="560" fill="#f5f7f2"/>
  <circle cx="1135" cy="35" r="175" fill="#eaf4f2" opacity=".8"/>
  <circle cx="45" cy="545" r="150" fill="#f8efe7" opacity=".85"/>
  <path d="M55 70 C320 8 480 115 680 55 S980 18 1145 75" fill="none" stroke="url(#thread)" stroke-width="5" stroke-linecap="round"/>
  <text x="55" y="138" class="kicker">AYNI TWIN · STATIC RELEASE</text>
  <text x="55" y="184" class="title">Current public architecture</text>
  <text x="55" y="216" class="detail">A browser-only educational demo hosted as static files.</text>

  <path d="M342 347 H444 M753 347 H855" fill="none" stroke="#177e78" stroke-width="4" stroke-linecap="round"/>
  <path d="m432 337 12 10-12 10 M843 337l12 10-12 10" fill="none" stroke="#177e78" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <g filter="url(#shadow)">
    <rect x="55" y="267" width="287" height="162" rx="26" class="card"/>
    <rect x="444" y="267" width="309" height="162" rx="26" class="card"/>
    <rect x="855" y="267" width="290" height="162" rx="26" class="card"/>
  </g>
  <circle cx="94" cy="307" r="11" fill="#c95f4a"/>
  <circle cx="484" cy="307" r="11" fill="#d58b32"/>
  <circle cx="895" cy="307" r="11" fill="#177e78"/>
  <text x="80" y="356" class="label">User browser</text>
  <text x="80" y="389" class="detail">Interaction and human review</text>
  <text x="469" y="356" class="label">AWS Amplify Hosting</text>
  <text x="469" y="389" class="detail">Serves HTML, CSS, JS, and images</text>
  <text x="880" y="356" class="label">AYNI Twin static app</text>
  <text x="880" y="389" class="detail">Synthetic, local simulations</text>

  <rect x="55" y="462" width="1090" height="55" rx="18" fill="#eaf4f2"/>
  <text x="80" y="496" class="detail">No deployed backend, database, login, or persistent student records.</text>
</svg>
